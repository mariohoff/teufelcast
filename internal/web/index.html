<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teufelcast</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; --card:#fff; --line:#d2d2d7;
          --go:#1a7f37; --stop:#c62828; --warn:#b26a00; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#1c1c1e; --card:#2c2c2e; --line:#3a3a3c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label.field { display:grid; gap:4px; flex:1; min-width:140px; font-size:13px; color:var(--muted); }
  select, button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
                   background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #toggle { font-size:18px; padding:12px; width:100%; color:#fff; border:0; background:var(--go); }
  #toggle.stop { background:var(--stop); }
  input[type=range] { flex:1; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; margin:0; }
  dt { color:var(--muted); }
  dd { margin:0; font-variant-numeric:tabular-nums; word-break:break-all; }
  .state { font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .state.streaming { color:var(--go); } .state.error { color:var(--stop); }
  .state.starting, .state.reconnecting { color:var(--warn); }
  #err { color:var(--stop); }
  #log { margin:0; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; max-height:260px; overflow:auto; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>teufelcast</h1>

  <section>
    <div class="row">
      <label class="field">Speaker
        <select id="device"></select>
      </label>
      <button id="refresh" title="Search the network again">Refresh</button>
    </div>
    <div class="row">
      <label class="field">Format
        <select id="format">
          <option value="mp3">MP3 320k</option>
          <option value="flac">FLAC (lossless)</option>
          <option value="wav">WAV (lossless)</option>
        </select>
      </label>
    </div>
    <label class="row"><input type="checkbox" id="switchDefault" checked> Switch system output to Teufel</label>
    <label class="row"><input type="checkbox" id="autoReconnect" checked> Auto-reconnect</label>
    <button id="toggle">Start</button>
    <div class="row">
      <span>Volume</span>
      <input type="range" id="volume" min="0" max="100" step="1">
      <span id="volval">–</span>
    </div>
  </section>

  <section>
    <dl>
      <dt>State</dt><dd><span id="state" class="state">–</span></dd>
      <dt>Speaker connected</dt><dd id="connected">–</dd>
      <dt>Speaker state</dt><dd id="transport">–</dd>
      <dt>Bytes sent</dt><dd id="bytes">–</dd>
      <dt>Uptime</dt><dd id="uptime">–</dd>
      <dt>Stream URL</dt><dd id="url">–</dd>
      <dt>Last error</dt><dd id="err">–</dd>
    </dl>
  </section>

  <section>
    <pre id="log"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, initialised = false, busy = false, volTimer = null, volDragging = false;

async function api(path, body) {
  const opt = body === undefined ? {} :
    { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) };
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fmtBytes(n) {
  const u = ['B','KiB','MiB','GiB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function fmtDur(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + sec + 's';
}

async function loadDevices(refresh) {
  $('refresh').disabled = true;
  try {
    const list = await api('/api/devices' + (refresh ? '?refresh=1' : ''));
    const want = $('device').value || (current && current.device);
    $('device').replaceChildren(...list.map(name => {
      const o = document.createElement('option');
      o.value = name; o.textContent = name; return o;
    }));
    if (want && !list.includes(want)) {
      const o = document.createElement('option');
      o.value = want; o.textContent = want + ' (not found)';
      $('device').prepend(o);
    }
    if (want) $('device').value = want;
    loadVolume();
  } catch (e) {
    $('err').textContent = 'discovery: ' + e.message;
  } finally {
    $('refresh').disabled = false;
  }
}

async function loadVolume() {
  if (volDragging) return;
  try {
    const v = await api('/api/volume?device=' + encodeURIComponent($('device').value));
    if (!volDragging) { $('volume').value = v.volume; $('volval').textContent = v.volume; }
  } catch (e) {
    $('volval').textContent = '–';
  }
}

$('volume').addEventListener('input', () => {
  volDragging = true;
  $('volval').textContent = $('volume').value;
  clearTimeout(volTimer);
  volTimer = setTimeout(async () => {
    try { await api('/api/volume', {device: $('device').value, volume: +$('volume').value}); }
    catch (e) { $('err').textContent = 'volume: ' + e.message; }
    volDragging = false;
  }, 150);
});

$('refresh').addEventListener('click', () => loadDevices(true));
$('device').addEventListener('change', loadVolume);

$('toggle').addEventListener('click', async () => {
  if (busy) return;
  busy = true; $('toggle').disabled = true;
  const running = current && current.state !== 'idle' && current.state !== 'error';
  try {
    if (running) await api('/api/stop', {});
    else await api('/api/start', {
      device: $('device').value, format: $('format').value,
      switchDefault: $('switchDefault').checked, autoReconnect: $('autoReconnect').checked,
    });
  } catch (e) {
    $('err').textContent = e.message;
  } finally {
    busy = false; $('toggle').disabled = false;
    poll();
  }
});

function render(s) {
  current = s;
  if (!initialised) {
    initialised = true;
    $('format').value = s.format;
    $('switchDefault').checked = s.switchDefault;
    $('autoReconnect').checked = s.autoReconnect;
  }
  const running = s.state !== 'idle' && s.state !== 'error';
  $('state').textContent = s.state;
  $('state').className = 'state ' + s.state;
  $('toggle').textContent = running ? 'Stop' : 'Start';
  $('toggle').classList.toggle('stop', running);
  for (const id of ['device', 'format', 'switchDefault', 'autoReconnect', 'refresh'])
    $(id).disabled = running;
  $('connected').textContent = running
    ? (s.connected ? 'yes (' + s.stream.remote + (s.stream.active > 1 ? ', ' + s.stream.active + ' connections' : '') + ')' : 'no')
    : '–';
  $('transport').textContent = running ? (s.transport || '…') : '–';
  $('bytes').textContent = running ? fmtBytes(s.stream.bytes) : '–';
  $('uptime').textContent = running && s.uptime ? fmtDur(s.uptime) : '–';
  $('url').textContent = s.url || '–';
  if (!busy) $('err').textContent = s.lastError || '–';
  const log = $('log'), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 8;
  log.textContent = (s.events || []).join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function poll() {
  try { render(await api('/api/status')); }
  catch (e) { $('state').textContent = 'offline'; $('state').className = 'state error'; }
}

(async () => {
  await poll();
  await loadDevices(false);
  setInterval(poll, 1000);
  setInterval(loadVolume, 10000);
})();
</script>
</body>
</html>
